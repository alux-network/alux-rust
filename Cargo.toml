[workspace]
resolver = "2"
members = ["alux-*", "crates/alux-*"]

[workspace.package]
authors = ["Tomislav Grospic <grospic@gmail.com>"]
edition = "2024"
homepage = "https://alux.network"
repository = "https://github.com/alux-network/alux-rust"
license = "MIT"
rust-version = "1.97"

[workspace.dependencies]
alux-ext = { version = "0.1", path = "alux-ext" }
alux-ext-macros = { version = "0.1", path = "alux-ext-macros" }
alux-http = { version = "0.1", path = "alux-http" }
alux-http-poem = { path = "crates/alux-http-poem" }
alux-http-text = { path = "crates/alux-http-text" }
alux-jsonrpc = { version = "0.2", path = "alux-jsonrpc" }
alux-jsonrpc-direct = { path = "crates/alux-jsonrpc-direct" }
alux-jsonrpc-jsonrpsee = { path = "crates/alux-jsonrpc-jsonrpsee" }
alux-jsonrpc-typescript = { path = "crates/alux-jsonrpc-typescript" }
alux-sdk = { version = "0.2", path = "alux-sdk" }
alux-sdk-macros = { version = "0.1", path = "alux-sdk-macros" }
alux-shape = { version = "0.1", path = "alux-shape" }
alux-shape-json = { version = "0.1", path = "crates/alux-shape-json" }
alux-shape-macros = { version = "0.1", path = "alux-shape-macros" }
alux-shape-morph = { path = "crates/alux-shape-morph" }
alux-shape-rust = { path = "crates/alux-shape-rust" }
alux-shape-term = { path = "crates/alux-shape-term" }
alux-shape-text = { version = "0.1", path = "crates/alux-shape-text" }
alux-shape-typescript = { version = "0.1", path = "crates/alux-shape-typescript" }
alux-tokio = { path = "crates/alux-tokio" }
alux-traversable = { version = "0.1", path = "alux-traversable" }

anyhow = "1"
derive_more = { version = "2", features = ["deref", "deref_mut", "from"] }
derive-new = "0.7"
extend = "1"
futures = "0.3"
jsonrpsee = { version = "0.26", features = ["server", "macros"] }
mockall = "0.14"
paste = "1"
poem = "3"
poem-openapi = "5"
proc-macro2 = "1"
proptest = "1"
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "3", features = ["full", "visit", "visit-mut"] }
thiserror = "2"
trait-set = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-stream = "0.1"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[workspace.metadata.release]
push = true
push-remote = "upstream"
tag = true
allow-branch = ["master"]
sign-commit = true
sign-tag = true
consolidate-commits = true
pre-release-commit-message = "chore: release"
